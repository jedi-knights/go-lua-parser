name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "VERSION"
      - "README.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check LICENSE file
        run: test -f LICENSE || (echo "::error::LICENSE file is missing" && exit 1)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          github-token: ${{ secrets.GH_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CI deps (lcov + gcov2lcov)
        run: make install-ci-deps

      - name: Verify dependencies
        run: make verify

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: make test-ci

      - name: Check coverage threshold
        # Delegates to the same target developers can run locally. The
        # threshold lives here (single source of truth for CI) so bumping
        # it is a one-line workflow change.
        run: make coverage-check COVERAGE_THRESHOLD=84

      - name: Publish test results
        if: always()
        uses: jedi-knights/publish-test-results@v0.3.0
        with:
          files: test-results.json
          check-name: Test Results
