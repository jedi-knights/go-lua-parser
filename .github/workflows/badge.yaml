name: Badge

# Triggered after the Release workflow completes on main. Running in a
# separate workflow (not a job in ci.yml) avoids a push race: if this job
# committed to main on the same push trigger as semantic-release, the
# version-bump push would be rejected with "fetch first".
#
# Approach mirrors jedi-knights/yoda.nvim: run tests, convert Go coverage
# to LCOV, generate the HTML report with genhtml, hand-roll the shields.io
# badge with tiered colors, and deploy the report to GitHub Pages.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  badge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install lcov
        run: sudo apt-get install -y --quiet lcov
        shell: bash

      - name: Run tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
        shell: bash

      - name: Convert coverage to LCOV
        # gcov2lcov pinned to a specific version — `@latest` risks silent
        # breakage on an upstream flag/output change. Bump deliberately.
        run: |
          go install github.com/jandelgado/gcov2lcov@v1.1.1
          mkdir -p coverage
          gcov2lcov -infile=coverage.out -outfile=coverage/lcov.info
        shell: bash

      - name: Compute line coverage
        id: coverage
        # Report line coverage (LCOV's metric) rather than statement coverage
        # (Go's native metric from `go tool cover -func`). The genhtml report
        # aggregates by line, so the badge and the report always agree.
        run: |
          set -euo pipefail
          PCT="$(lcov --summary coverage/lcov.info 2>&1 | grep -i '^\s*lines' | grep -oE '[0-9]+\.[0-9]+' | head -1)"
          if [ -z "$PCT" ]; then
            echo "::error::Failed to extract line coverage from lcov --summary"
            lcov --summary coverage/lcov.info 2>&1 || true
            exit 1
          fi
          echo "coverage-percentage=${PCT}" >> "$GITHUB_OUTPUT"
          echo "Line coverage: ${PCT}%"
        shell: bash

      - name: Generate HTML coverage report
        run: genhtml coverage/lcov.info -o htmlcov/ --quiet --ignore-errors source
        shell: bash

      - name: Update coverage badge
        run: |
          PCT="${{ steps.coverage.outputs.coverage-percentage }}"
          if [ -z "$PCT" ]; then
            echo "No coverage percentage output, skipping badge update"
            exit 0
          fi
          PCT_INT="${PCT%.*}"
          if [ "$PCT_INT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT_INT" -ge 80 ]; then COLOR="green"
          elif [ "$PCT_INT" -ge 70 ]; then COLOR="yellow"
          elif [ "$PCT_INT" -ge 60 ]; then COLOR="orange"
          else COLOR="red"
          fi
          URL_PCT=$(printf '%s' "$PCT" | sed 's/\./%2E/g')
          # Match up to either " (HTML img src) or ) (markdown link close)
          sed -i "s|img\.shields\.io/badge/Coverage-[^\")]*|img.shields.io/badge/Coverage-${URL_PCT}%25-${COLOR}|" README.md
        shell: bash

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "chore: update coverage badge [skip ci]" && git push)
        shell: bash

      # Third-party actions pinned by commit SHA (rules/owasp-top-10.md A03).
      - name: Upload Pages artifact
        if: success()
        id: upload-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: htmlcov/

      - name: Deploy to GitHub Pages
        if: success() && steps.upload-artifact.outcome == 'success'
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
