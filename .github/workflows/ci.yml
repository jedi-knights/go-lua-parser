name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "VERSION"
      - "README.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check LICENSE file
        run: test -f LICENSE || (echo "::error::LICENSE file is missing" && exit 1)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          github-token: ${{ secrets.GH_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: |
          set -o pipefail
          go test -race -count=1 -coverprofile=coverage.out -json ./... | tee test-results.json

      - name: Convert coverage to LCOV
        run: |
          sudo apt-get install -y --quiet lcov
          go install github.com/jandelgado/gcov2lcov@latest
          mkdir -p coverage
          gcov2lcov -infile=coverage.out -outfile=coverage/lcov.info

      - name: Check coverage threshold
        # Line coverage from lcov --summary — same metric the Badge workflow
        # and the deployed HTML report use, so the gate and the badge always
        # agree on what "coverage" means.
        run: |
          set -euo pipefail
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep -i '^\s*lines' | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "Line coverage: ${COVERAGE}%"
          if awk "BEGIN { exit !(${COVERAGE} < 84) }"; then
            echo "::error::Coverage ${COVERAGE}% is below the 84% threshold"
            exit 1
          fi

      - name: Publish test results
        if: always()
        uses: jedi-knights/publish-test-results@v0.3.0
        with:
          files: test-results.json
          check-name: Test Results
